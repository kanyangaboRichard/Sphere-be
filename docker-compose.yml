services:
  backend:
    build: .
    container_name: sphere-tech-be
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Docker-specific overrides only, everything else comes from .env
      - HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - S3_ENDPOINT=http://minio:9000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: sphere-tech-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - sphere_tech_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: sphere-tech-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  frontend:
    build: ../sphere-tech-Fe
    container_name: sphere-tech-fe
    ports:
      - "5170:5170"
    volumes:
      - ../sphere-tech-Fe:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sphere_tech_pgdata:
  minio_data: