services:
  backend:
    build: .
    container_name: sphere-tech-be
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sphere_tech_cms
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
      - JWT_SECRET=sphere_tech_super_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - MAIL_HOST=smtp.mailtrap.io
      - MAIL_PORT=2525
      - MAIL_USER=your_mailtrap_user
      - MAIL_PASS=your_mailtrap_pass
      - MAIL_FROM=noreply@spheretech.rw
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
      - S3_BUCKET=sphere-tech-media
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=sphereadmin
      - S3_SECRET_ACCESS_KEY=sphere-secret-key
      - S3_PUBLIC_BASE_URL=http://localhost:9000/sphere-tech-media
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: sphere-tech-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sphere_tech_cms
    volumes:
      - sphere_tech_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: sphere-tech-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=sphereadmin
      - MINIO_ROOT_PASSWORD=sphere-secret-key
    volumes:
      - minio_data:/data
    restart: unless-stopped

  frontend:
    build: ../sphere-tech-Fe
    container_name: sphere-tech-fe
    ports:
      - "5170:5170"
    volumes:
      - ../sphere-tech-Fe:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sphere_tech_pgdata:
  minio_data: